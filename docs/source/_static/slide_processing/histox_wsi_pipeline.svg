<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">HistoX whole-slide image workflow</title>
  <desc id="desc">A whole-slide image passes through quality control and regions of interest, tile extraction, feature encoders, and downstream pathology tasks.</desc>
  <defs>
    <linearGradient id="tissue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a245f"/>
      <stop offset="0.48" stop-color="#c24c86"/>
      <stop offset="1" stop-color="#ef9baa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6548"/>
    </marker>
  </defs>

  <rect width="1600" height="520" rx="26" fill="#f5f7fa"/>
  <text x="54" y="62" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">HistoX whole-slide workflow</text>
  <text x="54" y="96" font-family="Inter, Arial, sans-serif" font-size="19" fill="#667085">From a gigapixel slide to reproducible deep-pathology outputs</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="250" height="320" rx="20" fill="#ffffff" stroke="#d0d5dd"/>
    <rect x="350" y="132" width="250" height="320" rx="20" fill="#ffffff" stroke="#d0d5dd"/>
    <rect x="646" y="132" width="250" height="320" rx="20" fill="#ffffff" stroke="#d0d5dd"/>
    <rect x="942" y="132" width="250" height="320" rx="20" fill="#ffffff" stroke="#d0d5dd"/>
    <rect x="1238" y="132" width="308" height="320" rx="20" fill="#ffffff" stroke="#d0d5dd"/>
  </g>

  <g stroke="#ef6548" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M 312 292 H 338"/>
    <path d="M 608 292 H 634"/>
    <path d="M 904 292 H 930"/>
    <path d="M 1200 292 H 1226"/>
  </g>

  <!-- Whole-slide image -->
  <g>
    <text x="78" y="178" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Whole-slide image</text>
    <rect x="80" y="202" width="198" height="150" rx="8" fill="#fafafa" stroke="#98a2b3" stroke-width="2"/>
    <path d="M96 310 C109 252 132 231 168 238 C191 242 195 217 224 222 C250 226 263 256 252 278 C242 299 268 314 246 330 C213 354 183 326 158 333 C132 341 104 333 96 310 Z" fill="url(#tissue)"/>
    <path d="M117 302 C137 289 138 259 164 258 C190 256 202 284 228 269" fill="none" stroke="#f8d7df" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="278" r="7" fill="#642052"/>
    <circle cx="216" cy="301" r="9" fill="#642052"/>
    <text x="80" y="388" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475467">SVS · TIFF · NDPI</text>
    <text x="80" y="416" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">Read metadata and pyramid levels</text>
  </g>

  <!-- QC and ROI -->
  <g>
    <text x="374" y="178" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">QC and regions</text>
    <rect x="380" y="202" width="190" height="150" rx="8" fill="#f8e6ec" stroke="#98a2b3" stroke-width="2"/>
    <g stroke="#ffffff" stroke-width="2" opacity="0.9">
      <path d="M418 202 V352 M456 202 V352 M494 202 V352 M532 202 V352"/>
      <path d="M380 232 H570 M380 262 H570 M380 292 H570 M380 322 H570"/>
    </g>
    <path d="M402 320 L397 241 L446 216 L528 235 L548 289 L512 334 L439 341 Z" fill="none" stroke="#ef6548" stroke-width="6" stroke-linejoin="round"/>
    <path d="M382 202 H570 V225 H382 Z M382 335 H570 V352 H382 Z" fill="#172033" opacity="0.16"/>
    <text x="380" y="388" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475467">Otsu · blur · ROI</text>
    <text x="380" y="416" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">Remove background and artifacts</text>
  </g>

  <!-- Tiles -->
  <g>
    <text x="670" y="178" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Image tiles</text>
    <g transform="translate(686 207)">
      <g fill="url(#tissue)" stroke="#ffffff" stroke-width="4">
        <rect x="0" y="0" width="58" height="58" rx="7"/><rect x="62" y="0" width="58" height="58" rx="7"/><rect x="124" y="0" width="58" height="58" rx="7"/>
        <rect x="0" y="62" width="58" height="58" rx="7"/><rect x="62" y="62" width="58" height="58" rx="7"/><rect x="124" y="62" width="58" height="58" rx="7"/>
        <rect x="0" y="124" width="58" height="58" rx="7"/><rect x="62" y="124" width="58" height="58" rx="7"/><rect x="124" y="124" width="58" height="58" rx="7"/>
      </g>
      <g fill="#f8d7df" opacity="0.78">
        <circle cx="24" cy="24" r="8"/><circle cx="92" cy="28" r="12"/><circle cx="148" cy="37" r="9"/>
        <circle cx="31" cy="92" r="13"/><circle cx="96" cy="87" r="8"/><circle cx="153" cy="101" r="12"/>
        <circle cx="20" cy="149" r="8"/><circle cx="85" cy="157" r="13"/><circle cx="160" cy="151" r="9"/>
      </g>
    </g>
    <text x="676" y="420" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">Fixed physical scale and resolution</text>
  </g>

  <!-- Encoder -->
  <g>
    <text x="966" y="178" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Feature encoder</text>
    <g stroke="#7f56d9" stroke-width="3" opacity="0.85">
      <path d="M988 243 L1046 222 L1109 251 L1155 220"/>
      <path d="M988 292 L1046 270 L1109 300 L1155 274"/>
      <path d="M988 338 L1046 319 L1109 344 L1155 326"/>
      <path d="M1046 222 V319 M1109 251 V344"/>
    </g>
    <g fill="#7f56d9" stroke="#ffffff" stroke-width="4">
      <circle cx="988" cy="243" r="13"/><circle cx="988" cy="292" r="13"/><circle cx="988" cy="338" r="13"/>
      <circle cx="1046" cy="222" r="13"/><circle cx="1046" cy="270" r="13"/><circle cx="1046" cy="319" r="13"/>
      <circle cx="1109" cy="251" r="13"/><circle cx="1109" cy="300" r="13"/><circle cx="1109" cy="344" r="13"/>
      <circle cx="1155" cy="220" r="13"/><circle cx="1155" cy="274" r="13"/><circle cx="1155" cy="326" r="13"/>
    </g>
    <text x="974" y="388" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475467">CNN · ViT · foundation model</text>
    <text x="974" y="416" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">Build reusable feature bags</text>
  </g>

  <!-- Tasks -->
  <g>
    <text x="1262" y="178" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Downstream tasks</text>
    <rect x="1268" y="213" width="246" height="54" rx="12" fill="#fff1ed" stroke="#ef6548"/>
    <circle cx="1297" cy="240" r="11" fill="#ef6548"/>
    <text x="1322" y="247" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">Classification</text>
    <rect x="1268" y="281" width="246" height="54" rx="12" fill="#f3efff" stroke="#7f56d9"/>
    <path d="M1287 317 L1297 303 L1307 311 L1317 292" fill="none" stroke="#7f56d9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1332" y="315" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">Prognosis and MIL</text>
    <rect x="1268" y="349" width="246" height="54" rx="12" fill="#ecfdf3" stroke="#15803d"/>
    <circle cx="1297" cy="376" r="11" fill="none" stroke="#15803d" stroke-width="4"/>
    <path d="M1304 383 L1315 394" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <text x="1332" y="383" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#172033">Retrieval and VLM</text>
    <text x="1274" y="430" font-family="Inter, Arial, sans-serif" font-size="15" fill="#667085">One preprocessing path, many models</text>
  </g>
</svg>
