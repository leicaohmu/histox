name: Package checks

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate distribution
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build flake8 twine

      - name: Check for fatal Python errors
        run: |
          flake8 histox setup.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check HistoX product identity
        run: |
          python scripts/check_identity.py

      - name: Build distributions
        run: |
          rm -rf dist build *.egg-info
          python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py
          python -m pip install --no-deps dist/*.whl
          python -c "from importlib.metadata import version; print(version('histox'))"
          smoke_root="$(mktemp -d)"
          mkdir "$smoke_root/histox"
          cd "$smoke_root"
          python -c "import importlib.util as u; s = u.find_spec('histox'); assert s is not None and s.origin is not None, s; print(s.origin)"

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }}, CPU)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips

      - name: Install HistoX with CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[torch,huggingface]"

      - name: Run unit tests
        run: |
          # slide_test is a functional suite that needs real slides; run it
          # through scripts/test.py instead.
          modules=$(ls histox/test/*_test.py | grep -v '/slide_test.py$' | sed 's#/#.#g; s#\.py$##')
          python -m unittest -v $modules

  docs:
    name: Documentation build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install HistoX and documentation dependencies
        # Mirrors .readthedocs.yaml: install the package, then the docs
        # requirements (which pin a CPU PyTorch wheel) in a separate step.
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: |
          python -m sphinx -b html -q -w sphinx-warnings.txt docs/source docs/_build/html

      - name: Fail on new Sphinx warnings
        run: |
          # Extensionless GitHub video URLs on the Studio page trigger a
          # known, harmless sphinxcontrib-video warning.
          known='The provided file type ("") is not a supported format'
          if grep -vF "$known" sphinx-warnings.txt | grep -q .; then
            echo "::error::New Sphinx warnings:"
            grep -vF "$known" sphinx-warnings.txt
            exit 1
          fi
          echo "No new Sphinx warnings."

  tensorflow-smoke:
    name: Deprecated TensorFlow backend (Python 3.11, smoke test)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips

      - name: Install HistoX with TensorFlow
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tf]"

      - name: Import the TensorFlow code paths
        env:
          HX_BACKEND: tensorflow
        run: |
          python -W always -c "
          import histox as hx
          assert hx.backend() == 'tensorflow'
          import histox.model.tensorflow, histox.io.tensorflow
          hp = hx.ModelParams(tile_px=64, tile_um=64, model='resnet50', epochs=1)
          model = hp.build_model(num_classes=2, pretrain=None)
          print('TensorFlow backend OK:', type(model).__name__)
          " 2>&1 | tee tf.log
          grep -q HistoXDeprecationWarning tf.log
