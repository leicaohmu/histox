name: Package checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build and validate distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build flake8 twine

      - name: Check for fatal Python errors
        run: |
          flake8 histox setup.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Build distributions
        run: |
          rm -rf dist build *.egg-info
          python -m build

      - name: Validate distributions
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py
          python -m pip install --no-deps dist/*.whl
          python -c "from importlib.metadata import version; print(version('histox'))"
